name: Release Drafter

on:
  pull_request:
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: read

jobs:
  auto_label:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write

    steps:
    - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
