name: Template

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  generate:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: .build/template-test

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install Copier
      working-directory: .
      run: brew install copier
    - name: Generate project
      working-directory: .
      run: make generate
    - name: Build
      run: SKIP_PLUGINS=1 swift build
    - name: Run tests
      run: SKIP_PLUGINS=1 swift test
    - name: Check formatting
      run: make ci-format
    - name: Run Linter
      run: make ci-lint
