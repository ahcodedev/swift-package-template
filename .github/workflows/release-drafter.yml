name: Release Drafter

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: read

jobs:
  update_release_draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read

    steps:
    - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0

  auto_label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write

    steps:
    - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
