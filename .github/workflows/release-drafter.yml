name: Release Drafter

on:
  pull_request:
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: read

jobs:
  auto_label:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write

    steps:
    - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
